<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMC Catalyst - Your Pathway to Medical Success</title>
    <script>
      // Set the dark class before first paint so a dark-theme visitor doesn't
      // see a white flash. Only the public pages have a dark theme — keep this
      // list in step with the routes wrapped in <ThemeArea> in App.jsx.
      try {
        var publicPaths = ['/', '/testimonials', '/features', '/pricing', '/contact', '/terms', '/privacy', '/login', '/register', '/registration-success'];
        if (localStorage.getItem('amc_catalyst_theme') === 'dark' && publicPaths.indexOf(location.pathname.replace(/\/$/, '') || '/') !== -1) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
