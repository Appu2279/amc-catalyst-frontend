<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMC Catalyst - Best AMC Coaching for International Doctors</title>
    <meta name="description" content="Dr. Solosailor's AMC Catalyst - the best AMC coaching for IMGs. AMC 1 recall questions, high-yield notes, flashcards and grand mock exams to help you pass." />
    <link rel="canonical" href="https://www.amccatalyst.com/" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AMC Catalyst" />
    <meta property="og:url" content="https://www.amccatalyst.com/" />
    <meta property="og:title" content="AMC Catalyst - Best AMC Coaching for International Doctors" />
    <meta property="og:description" content="AMC 1 recall questions, high-yield notes, flashcards and grand mock exams to help you pass the AMC exam." />
    <meta property="og:image" content="https://www.amccatalyst.com/images/logo.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Tells Google the site's name, so results show "AMC Catalyst" instead of the bare domain. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AMC Catalyst",
        "alternateName": "Dr. Solosailor's AMC Catalyst",
        "url": "https://www.amccatalyst.com/"
      }
    </script>
    <script>
      // Set the dark class before first paint so a dark-theme visitor doesn't
      // see a white flash. Only the public pages have a dark theme — keep this
      // list in step with the routes wrapped in <ThemeArea> in App.jsx.
      try {
        var publicPaths = ['/', '/testimonials', '/features', '/pricing', '/contact', '/terms', '/privacy', '/login', '/register', '/registration-success'];
        if (localStorage.getItem('amc_catalyst_theme') === 'dark' && publicPaths.indexOf(location.pathname.replace(/\/$/, '') || '/') !== -1) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
